description: >-
  FlexEngage is a retail customer-engagement company that powered transactional and triggered
  customer communications for retailers and brands, including digital receipts, order and shipping
  notifications, and omnichannel messaging across email, SMS, and print. The company was backed by
  Bullpen Capital and was acquired by Narvar in 2019. This API Evangelist profile was surfaced from
  the Bullpen Capital portfolio; the public site (www.flexengage.com) is currently served behind
  CloudFront and returns HTTP 403 to automated clients, so no public developer/API surface could be
  captured during enrichment.
